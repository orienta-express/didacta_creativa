SCENES[1].history='Annibale dispose Galli e Iberi al centro avanzato, i fanti africani ai lati e la cavalleria sulle ali. Sotto la pressione romana, il centro arretrò; i fanti africani intervennero sui fianchi e la cavalleria chiuse alle spalle dei Romani. La visualizzazione semplifica le fasi della manovra.';

if(page===0){html=`<section class="screen hero active"><div><div class="eyebrow">Esperienza didattica · Didacta Lanciano</div><h1>CANNE<em>La storia aspetta<br>una vostra decisione.</em></h1><p class="intro">2 agosto, 216 a.C.<br>Due eserciti nella pianura. Quattro decisioni.<br>Questa volta, a scegliere siete voi.</p><div class="hero-meta"><span><b>02</b>SQUADRE</span><span><b>04</b>DECISIONI</span><span><b>40″</b>PER SCEGLIERE</span></div><button class="primary" id="start">Entra nella storia →</button><p class="muted" style="font-size:12px">Un portavoce per squadra. Nessun punteggio: conta il perché.</p></div></section>`}
else if(page===1){html=`<section class="screen active wrap"><div class="eyebrow">Prima di scegliere / Il campo e le regole</div><h2>Il numero è davvero un vantaggio?</h2><div class="split"><div class="panel">${map()}<div class="stats"><div class="red"><strong>86.000</strong>ROMANI</div><div class="teal"><strong>50.000</strong>CARTAGINESI</div></div><p>Roma: <b>80.000 fanti + 6.000 cavalieri.</b><br>Cartagine: <b>40.000 fanti + 10.000 cavalieri.</b></p><small>Cifre indicative riportate nell’attività, secondo Polibio. Le consistenze degli eserciti sono stime antiche, non dati certi.</small></div><div class="panel"><h3>Non dovete indovinare.<br>Dovete prendere posizione.</h3><div class="steps"><div><b>01</b><p><b style="font:inherit;color:var(--ink)">Entrate nel ruolo.</b><br>Dividetevi in Romani e Cartaginesi; scegliete un portavoce.</p></div><div><b>02</b><p>Il Master avvia i <b style="font:inherit">40 secondi</b>. Discutete, scegliete e mimate la decisione per 5 secondi.</p></div><div><b>03</b><p>Spiegate il perché. Il Master rivela la storia: leggetela attraverso strategia, politica e risorse.</p></div><div><b>04</b><p>L’altra squadra porta un esempio di oggi. Poi si cambia ruolo.</p></div></div><p class="muted">Il tempo guida la discussione: non blocca la scelta. Le alternative sono semplificazioni didattiche.</p></div></div></section>`}
else if(page>=2&&page<=5){let i=page-2,s=SCENES[i],st=states[i];html=`<section class="screen active wrap"><div class="scene-head"><div><div class="eyebrow">Decisione 0${i+1} / 04 · ${lensNames[s.lens]}</div><h2>${esc(s.title)}</h2><div class="team ${s.team==='R'?'red':'teal'}">${names[s.team]} · ${['I CONSOLI','SALA DI COMANDO','DOPO LA VITTORIA','IL SENATO'][i]}</div></div><div class="timerbox ${st.revealed?'hidden':''}"><span class="clock" id="clock">00:${String(st.remaining).padStart(2,'0')}</span><button id="timer">${st.remaining===0?'Riparti':st.remaining<40?'Riprendi':'Avvia 40″'}</button></div></div><div class="timebar"><i id="timefill" style="width:${st.remaining/40*100}%"></i></div><div class="split"><div><p class="situation">${esc(s.situation)}</p><div class="options" role="group" aria-label="Alternative della squadra">${s.opts.map((o,k)=>`<button class="opt ${st.choice===k?'selected':''} ${st.revealed&&s.real===k?'historical':''}" data-choice="${k}" aria-pressed="${st.choice===k}" ${st.revealed?'disabled':''}><b>${k+1}</b><span>${esc(o)}${st.revealed&&s.real===k?'<em>SCELTA STORICA</em>':''}</span></button>`).join('')}</div><p class="status" id="status" aria-live="polite">${st.revealed?'La storia è un confronto, non un punteggio.':st.choice===null?'Discutete insieme, poi il portavoce sceglie.':'Scelta registrata. Quale ragione la sostiene?'}</p>${st.choice!==null?`<div class="gesture"><b>5 secondi per rappresentarla</b><br>${esc(s.gest[st.choice])}</div>`:''}<div class="master-note"><b>Nota del Master</b><br>${esc(s.master)}<br>Se il gesto non è accessibile, descrivetelo a parole. Invitate a motivare la scelta prima della rivelazione.</div></div><div>${st.revealed?`<div class="panel reveal"><div class="eyebrow">Il riscontro storico</div><h3>Che cosa accadde davvero</h3><p>${esc(s.history)}</p>${i===1?battle():''}<div class="lenses">${Object.entries(s.lens3).map(([k,v])=>`<div class="lens"><b>${lensNames[k]}</b>${esc(v)}</div>`).join('')}</div></div><div class="today"><div class="eyebrow">216 a.C. → Oggi · Risponde l’altra squadra</div><p>${questions[i]}</p></div>`:`<div class="scene-visual" role="img" aria-label="Illustrazione evocativa della pianura prima della battaglia"></div><div class="await"><div class="seal">${i+1}</div><div class="eyebrow">Tocca ai ${names[s.team]}</div><h3 style="margin-top:16px">${st.choice===null?'Non conoscete ancora il futuro.':'La decisione è vostra.'}</h3><p>${st.choice===null?'Quali informazioni contano?<br>Quale rischio siete disposti a correre?':'Prima di conoscere la storia,<br>raccontate perché avete scelto così.'}</p><small>${st.choice===null?'Il Master avvia il tempo quando la squadra è pronta.':'Premete “Rivela la storia” quando il confronto è concluso.'}</small></div>`}</div></div></section>`}
else{html=`<section class="screen active wrap closing"><div class="eyebrow">Un salto nel tempo / Dalla strategia al pensiero critico</div><h2>Canne. La Marna. E le nostre scelte.</h2><div class="split comparison"><article class="panel"><div class="eyebrow">216 a.C. · Canne</div><h3>Una vittoria che diventa un modello</h3><p>Annibale accerchia un esercito più numeroso: il centro arretra, i fanti africani intervengono sui fianchi e la cavalleria chiude alle spalle. La manovra diventa un riferimento per chi studia la strategia.</p></article><article class="panel"><div class="eyebrow">Settembre 1914 · La Marna, Francia</div><h3>L’aggiramento non basta</h3><p>Schlieffen studia Canne. Il piano tedesco punta a un vasto aggiramento attraverso il Belgio; nella campagna del 1914, però, l’avanzata viene fermata dalla controffensiva franco-britannica sulla Marna. La vittoria rapida non arriva.</p></article></div><div class="variables"><div><b>Tempo e scala</b><span>Una battaglia in poche ore; una campagna su distanze molto più ampie.</span></div><div><b>Risorse e coordinamento</b><span>Marce, rifornimenti e collegamenti tra armate cambiano le condizioni del piano.</span></div><div><b>Reazione dell’avversario</b><span>Il risultato dipende anche dalle decisioni altrui, non soltanto dal proprio schema.</span></div></div><p class="closing-principle">Un modello vincente non garantisce lo stesso risultato<br><em>quando cambia il contesto.</em></p><div class="today ai-reflection"><div class="eyebrow">Il salto di oggi / Intelligenza artificiale e scelte didattiche</div><h3>Dal sentito dire all’esperienza diretta</h3><p>Una buona idea acquista valore quando incontra gli obiettivi e i bisogni della propria scuola. Anche con l’intelligenza artificiale, scegliere consapevolmente significa verificare, sperimentare e adattare.</p><button class="primary" id="meta-toggle" aria-expanded="false" aria-controls="meta-question">Una domanda per riflettere →</button><div id="meta-question" class="metacognition hidden"><div class="eyebrow">Metacognizione / Come scelgo</div><h3>Quando scelgo una proposta didattica, su che cosa mi baso:<br>sul sentito dire, sull’esperienza diretta o sulla sua rispondenza ai bisogni della mia classe?</h3><div class="reflection-cues"><span>CONOSCO</span><span>SPERIMENTO</span><span>ADATTO</span></div><small>30 secondi per ripensare a una vostra scelta didattica e ai criteri che l’hanno guidata.</small></div><div class="oltre-invitation"><div class="eyebrow">Con Oltre / Dall’esperienza al progetto</div><p>Con Oltre potete vedere e provare strumenti e attività, comprenderne il funzionamento e confrontarvi sulle esigenze della vostra scuola. Da qui prendono forma progetti personalizzati e soluzioni chiavi in mano, con un supporto concreto alla realizzazione.</p><h3>Ve le mostriamo. Le proviamo insieme.<br><em>Costruiamo il percorso per la vostra scuola.</em></h3></div></div><div class="master-note"><b>Nota del Master</b><br>Il confronto storico serve a interrogare il trasferimento di un modello, non a spiegare la Marna come una semplice copia fallita di Canne. Aprite il confronto sulle variabili; poi mostrate la domanda sui criteri di scelta. Raccogliete un esempio dalla sala e collegate l’esperienza appena vissuta alla possibilità di conoscere e provare le proposte Oltre, approfondendo bisogni, personalizzazione e supporto alla realizzazione. Il collegamento all’IA è un’analogia didattica.</div><details><summary>Riferimenti storici e indicazioni d’uso</summary><p>Canne e la Marna appartengono a scale operative e contesti diversi. Schlieffen dedicò studi a Canne; il rapporto tra questi studi, i piani tedeschi e le operazioni del 1914 è oggetto di dibattito storiografico. La sconfitta sulla Marna non si riduce a un errore di imitazione. Il confronto proposto è una chiave di riflessione didattica, non una spiegazione unica degli eventi.</p><p>Per approfondire: <a href="https://www.dhm.de/lemo/kapitel/erster-weltkrieg/kriegsverlauf/marne" target="_blank" rel="noopener noreferrer">Deutsches Historisches Museum · La battaglia della Marna</a>; <a href="https://history.army.mil/Portals/143/Images/Publications/ArmyHistoryMag/pdf/20002009/AH53newOCR.pdf" target="_blank" rel="noopener noreferrer">Army History, n. 53 · Il dibattito sugli studi di Schlieffen</a>.</p><p>Attività adattata dai file forniti. Cifre degli eserciti e racconti di Polibio e Livio richiedono lettura critica. Immagine evocativa generata con IA, non ricostruzione documentaria. Schemi semplificati e non in scala. I collegamenti alle fonti richiedono internet; l’attività funziona offline.</p><p>Comandi: frecce per navigare, 1–2–3 per scegliere, N per le note, F per lo schermo intero. Il timer si avvia manualmente. Le scelte si azzerano chiudendo o ricaricando la pagina; nessun dato viene inviato.</p></details></section>`}

app.innerHTML=html;$('#progress').style.width=page/6*100+'%';$('#prev').disabled=page===0;$('#next').disabled=page===6;$('#next').textContent=page===0?'Entra nella storia →':page===1?'Prima decisione →':page===6?'Percorso concluso':states[page-2].revealed?(page===5?'Da Canne alla Marna →':'Prossima decisione →'):'Rivela la storia →';$('#dots').innerHTML=Array.from({length:7},(_,i)=>`<button class="${i===page?'on':''}" aria-label="${['Inizio','Campo e regole','Decisione 1','Decisione 2','Decisione 3','Decisione 4','Canne, Marna e IA'][i]}" ${i===page?'aria-current="step"':''} data-page="${i}"></button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page));if($('#start'))$('#start').onclick=next;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice));if($('#timer'))$('#timer').onclick=toggleTimer;

function next(){if(page>=2&&page<=5&&!states[page-2].revealed){if(states[page-2].choice===null){$('#status').textContent='Prima scegliete un’alternativa: 1, 2 oppure 3.';return}states[page-2].revealed=true;render()}else go(page+1)}
function toggleTimer(){let s=states[page-2];if(s.running){stop();$('#timer').textContent='Riprendi';return}if(s.remaining===0)s.remaining=40;s.running=true;$('#timer').textContent='Pausa';let deadline=Date.now()+s.remaining*1000;interval=setInterval(()=>{s.remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('#clock').textContent='00:'+String(s.remaining).padStart(2,'0');$('#timefill').style.width=s.remaining/40*100+'%';if(s.remaining===0){stop();$('#timer').textContent='Riparti';$('#status').textContent='Tempo concluso. Il portavoce sceglie: potete ancora confrontarvi.'}},150)}
$('#next').onclick=next;$('#prev').onclick=()=>go(page-1);$('#notes').onclick=()=>{notes=!notes;document.body.classList.toggle('notes',notes);$('#notes').setAttribute('aria-pressed',String(notes))};async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){alert('Schermo intero non disponibile qui. Apri il file nel browser e usa F11.')}}$('#fullscreen').onclick=fullscreen;$('#reset').onclick=()=>{if(confirm('Ricominciare e azzerare le quattro scelte?')){states=SCENES.map(()=>({choice:null,revealed:false,remaining:40,running:false}));go(0)}};
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.altKey||e.metaKey)return;if(e.target.closest('button,input,textarea,summary')&&(e.key===' '||e.key==='Enter'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();go(page-1)}else if(['1','2','3'].includes(e.key))choose(+e.key-1);else if(e.key.toLowerCase()==='n')$('#notes').click();else if(e.key.toLowerCase()==='f')fullscreen()});render();
</script></body></html>
