<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canne, 216 a.C. · due squadre</title>
<style>
  :root {
    --bg: #0f1d24; --bg2: #172a34; --panel: #1d3541; --line: #2c4856;
    --text: #f4efe6; --muted: #a8bcc6;
    --teal: #55b3bf; --orange: #e3792b; --gold: #e8b24a; --green: #6fae95; --purple: #9378cf; --red: #e06a57;
    --str: #e3792b; --pol: #9378cf; --res: #6fae95;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 20% -10%, #21404e 0%, transparent 60%), var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .hud { display: flex; align-items: center; gap: 18px; padding: 12px 28px; }
  .hud .mission { font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 700; white-space: nowrap; }
  .xp { flex: 1; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .xp > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold)); border-radius: 99px; transition: width .35s ease; }
  .hud .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .hud button { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .hud button:hover { color: var(--text); border-color: var(--teal); }

  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 4px 28px 14px; min-height: 0; }
  .card {
    width: min(1240px, 100%); max-height: 100%;
    background: linear-gradient(180deg, var(--bg2), var(--panel));
    border: 1px solid var(--line); border-radius: 28px;
    padding: clamp(20px, 3.2vw, 46px);
    box-shadow: 0 30px 80px rgba(0,0,0,.45);
    display: none; overflow: auto;
  }
  .card.active { display: block; animation: rise .35s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card.active, .reveal { animation: none !important; } .xp > i { transition: none; } }

  .tag { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; padding: 7px 14px; border-radius: 99px; margin-bottom: 14px; }
  .tag.game { background: rgba(232,178,74,.18); color: var(--gold); }
  .tag.str { background: rgba(227,121,43,.2); color: var(--str); }
  .tag.pol { background: rgba(147,120,207,.22); color: var(--pol); }
  .tag.res { background: rgba(111,174,149,.22); color: var(--res); }
  .tag.salto { background: rgba(111,174,149,.2); color: var(--green); }

  h1 { font-size: clamp(38px, 6.4vw, 88px); line-height: .98; margin: 0 0 14px; letter-spacing: -.02em; }
  h2 { font-size: clamp(26px, 3.8vw, 50px); line-height: 1.05; margin: 0 0 14px; letter-spacing: -.01em; }
  p.lead { font-size: clamp(17px, 2vw, 26px); line-height: 1.4; margin: 0 0 12px; max-width: 46ch; }
  p.small { font-size: clamp(15px, 1.7vw, 21px); color: var(--muted); line-height: 1.5; margin: 0; }
  .grid { display: grid; gap: 22px; }
  .two { grid-template-columns: 1fr 1fr; align-items: start; }
  .three { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 900px) { .two, .three { grid-template-columns: 1fr; } }

  .box { background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 18px; padding: 16px 20px; }
  .box h3 { margin: 0 0 6px; font-size: clamp(18px, 2vw, 26px); }
  .box p { margin: 0; font-size: clamp(15px, 1.6vw, 20px); line-height: 1.45; color: var(--muted); }
  .box .role { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; margin-bottom: 8px; display: block; }

  .prompt { margin-top: 18px; padding: 14px 18px; border-left: 5px solid var(--purple); background: rgba(147,120,207,.12); border-radius: 0 14px 14px 0; font-size: clamp(16px, 1.8vw, 22px); line-height: 1.4; }
  .prompt.salto { border-color: var(--green); background: rgba(111,174,149,.12); }
  .prompt.master { border-color: var(--gold); background: rgba(232,178,74,.1); display: none; }
  body.master .prompt.master { display: block; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .chip { padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); font-size: clamp(14px, 1.5vw, 18px); background: rgba(255,255,255,.04); }

  .big-hint { margin-top: 26px; font-size: clamp(16px, 1.8vw, 22px); color: var(--gold); font-weight: 700; }
  .keys { margin-top: 10px; font-size: 14px; color: var(--muted); line-height: 1.9; }
  .keys kbd { font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: rgba(255,255,255,.05); }

  /* scheda */
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; font-size: clamp(14px, 1.5vw, 18px); }
  .bar b { width: 108px; font-weight: 700; flex: none; }
  .bar .track { flex: 1; height: 16px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar .track i { display: block; height: 100%; border-radius: 99px; }
  .bar span { width: 72px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .vsrow { margin-bottom: 14px; }
  .vsrow .lab { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .lens { display: grid; gap: 10px; margin-top: 14px; }
  .lens > div { display: flex; gap: 14px; align-items: baseline; font-size: clamp(15px, 1.65vw, 21px); line-height: 1.4; }
  .lens b { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; flex: none; min-width: 108px; text-align: center; }
  .lens .s b { background: rgba(227,121,43,.2); color: var(--str); }
  .lens .p b { background: rgba(147,120,207,.22); color: var(--pol); }
  .lens .r b { background: rgba(111,174,149,.22); color: var(--res); }

  /* scene */
  .who { font-size: clamp(14px, 1.5vw, 18px); color: var(--gold); font-weight: 700; margin-bottom: 8px; }
  .opts { display: grid; gap: 12px; margin-top: 14px; }
  .opt { text-align: left; font: inherit; color: var(--text); background: rgba(255,255,255,.05); border: 2px solid var(--line); border-radius: 16px; padding: 13px 16px; font-size: clamp(15px, 1.65vw, 21px); line-height: 1.35; cursor: pointer; display: flex; gap: 14px; align-items: flex-start; transition: border-color .15s, background .15s; }
  .opt:hover, .opt:focus-visible { border-color: var(--gold); outline: none; }
  .opt kbd { font: inherit; font-weight: 800; background: var(--gold); color: #1c2b33; border-radius: 9px; padding: 2px 10px; flex: none; }
  .opt.picked { border-color: var(--gold); background: rgba(232,178,74,.15); }
  .opt.real { border-color: var(--green); background: rgba(111,174,149,.16); }
  .opt .real-badge { margin-left: auto; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--green); white-space: nowrap; flex: none; padding-top: 4px; }
  .side { display: grid; gap: 14px; align-content: start; }
  .panel { border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; background: rgba(255,255,255,.04); }
  .panel h4 { margin: 0 0 8px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
  .panel p { margin: 0; font-size: clamp(15px, 1.65vw, 21px); line-height: 1.45; }
  .reveal { animation: rise .4s ease both; }
  .wait { color: var(--muted); font-size: clamp(15px, 1.65vw, 21px); line-height: 1.5; border: 2px dashed var(--line); border-radius: 18px; padding: 22px; text-align: center; }
  .hint { margin-top: 14px; font-size: clamp(14px, 1.5vw, 18px); color: var(--gold); font-weight: 700; }
  .gest { display: block; margin-top: 4px; font-style: normal; font-size: clamp(14px, 1.45vw, 18px); color: #cfdde3; line-height: 1.3; }
  .gest b { color: var(--gold); letter-spacing: .1em; text-transform: uppercase; font-size: .85em; margin-right: 6px; }
  .teamb { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 6px 14px; border-radius: 99px; margin: 0 0 10px 8px; vertical-align: middle; }
  .teamb.R { background: rgba(227,121,43,.2); color: var(--orange); }
  .teamb.C { background: rgba(85,179,191,.2); color: var(--teal); }
  .oggi { display: grid; gap: 8px; margin-top: 4px; }
  .oggi > div { display: flex; gap: 12px; align-items: baseline; font-size: clamp(14px, 1.5vw, 19px); line-height: 1.35; }
  .oggi b { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; flex: none; min-width: 86px; text-align: center; background: rgba(232,178,74,.18); color: var(--gold); }
  .oggi-q { margin-top: 12px; font-size: clamp(16px, 1.75vw, 22px); font-weight: 700; line-height: 1.35; color: var(--text); }
  .who-r { margin-top: 10px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }
  .steps { display: grid; gap: 10px; margin-top: 12px; }
  .steps > div { display: flex; gap: 14px; align-items: baseline; font-size: clamp(15px, 1.65vw, 21px); line-height: 1.35; }
  .steps b { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--gold); color: #1c2b33; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; }
  .note { font-size: clamp(12px, 1.2vw, 15px); color: var(--muted); margin-top: 10px; line-height: 1.4; }

  .nav { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 28px 14px; }
  .nav button.arrow { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 9px 18px; font-size: 18px; cursor: pointer; }
  .nav button.arrow:hover { border-color: var(--teal); }
  .nav button.arrow:disabled { opacity: .35; cursor: default; }
  .dots { display: flex; gap: 8px; }
  .dots button { width: 12px; height: 12px; border-radius: 50%; border: 0; background: var(--line); padding: 0; cursor: pointer; }
  .dots button.on { background: var(--gold); transform: scale(1.25); }
  .dots button.done { background: var(--teal); }
  .lesson { margin: 18px 0 14px; padding: 16px 22px; border-left: 6px solid var(--gold); background: rgba(232,178,74,.14); border-radius: 12px; font-size: clamp(20px,2.3vw,30px); font-weight: 800; line-height: 1.25; }
  .grid.four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 900px) { .grid.four { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>

<header class="hud">
  <div class="mission">Canne · 216 a.C. · Romani contro Cartaginesi</div>
  <div class="xp" aria-hidden="true"><i id="xp"></i></div>
  <div class="count" id="count" aria-live="polite"></div>
  <button id="mbtn" aria-label="Note per chi conduce (tasto N)">Note · N</button>
  <button id="fs" aria-label="Schermo intero (tasto F)">Schermo intero · F</button>
</header>

<main class="stage" id="stage"></main>

<nav class="nav" aria-label="Navigazione">
  <button class="arrow" id="prev" aria-label="Indietro">←</button>
  <div class="dots" id="dots"></div>
  <button class="arrow" id="next" aria-label="Avanti">→</button>
</nav>

<script>
(function () {
  'use strict';

  /* Due squadre, quattro decisioni: strategia, politica, risorse.
     Nessun punteggio: una squadra decide, si rivela la storia, l'altra squadra porta la storia all'attualità.
     Fonti: Polibio e Livio, come riportati nelle ricostruzioni moderne di Canne (2 agosto 216 a.C.). */
  var LENS = {
    str: { name: 'Strategia', css: 'str' },
    pol: { name: 'Politica', css: 'pol' },
    res: { name: 'Risorse', css: 'res' }
  };
  var TEAMS = { R: 'Romani', C: 'Cartaginesi' };

  var SCENES = [
    {
      team: 'R', lens: 'pol', who: 'Squadra Romani: siete i consoli',
      title: 'Chi comanda oggi?',
      situation: 'Annibale è accampato in pianura, vicino a Canne, in Puglia. Roma ha mobilitato un esercito enorme per fermarlo. I due consoli non la pensano allo stesso modo: Varrone vuole lo scontro, Emilio Paolo diffida della pianura aperta. Il comando passa ogni giorno dall’uno all’altro. Oggi comanda Varrone. Che decisione prendete?',
      opts: ['Dare battaglia oggi, in pianura, con tutto l’esercito', 'Aspettare e logorare Annibale, evitando lo scontro', 'Spostare l’accampamento in collina, lontano dalla pianura'],
      real: 0,
      gest: ['Un passo avanti, pugno al petto, braccio teso verso la pianura', 'Braccia conserte, un passo indietro, dita che tamburellano', 'Mani che salgono a gradini, sguardo verso l’alto'],
      history: 'Quel giorno il comando era di Varrone e Roma scelse di combattere: il 2 agosto del 216 a.C., in pianura, vicino a Canne. Un anno prima Roma aveva provato a logorare Annibale con Fabio Massimo, detto il Temporeggiatore.',
      lens3: { str: 'Il numero sembrava un vantaggio decisivo, ma la pianura favoriva la cavalleria cartaginese, più numerosa.', pol: 'Due consoli che si alternano: la linea cambia ogni giorno, e quel giorno decideva chi voleva lo scontro.', res: 'Il punto di forza di Roma era la quantità di uomini: 86.000 contro circa 50.000 (stime di Polibio).' },
      master: 'Un portavoce per squadra. 40 secondi per decidere, poi il tasto 1, 2 o 3. Poi si leggono i tre sguardi sulla storia.'
    },
    {
      team: 'C', lens: 'str', who: 'Squadra Cartaginesi: siete Annibale e i suoi comandanti',
      title: 'Come schierare l’esercito?',
      situation: 'Siete in minoranza: circa 50.000 uomini contro quasi 86.000 (stime di Polibio). Ma avete più cavalleria e vi trovate su un terreno aperto. Come disponete l’esercito?',
      opts: ['In linea retta e compatta, con i migliori soldati al centro', 'A mezzaluna: centro avanzato con Galli e Iberi, fanti africani ai lati, cavalleria sulle ali', 'Ritirarsi sulle alture ed evitare la battaglia'],
      real: 1,
      gest: ['Spalla a spalla, braccia avanti come una fila di scudi', 'Due avanzano, gli altri ai lati con le braccia ad arco che si chiudono', 'Due passi indietro, mano a visiera, sguardo lontano'],
      history: 'Annibale scelse la mezzaluna: al centro, avanzati verso i Romani, Galli e Iberi; ai lati la fanteria africana; sulle ali la cavalleria. Il centro arretrò di proposito, la mezzaluna si ripiegò e i Romani furono accerchiati.',
      lens3: { str: 'Il centro debole era una trappola: attirare i Romani in avanti per chiuderli sui fianchi.', pol: 'Nell’esercito di Annibale c’erano Galli, Iberi, Africani e Numidi: tenerli uniti era anche un compito politico.', res: 'Con meno soldati, Annibale usò ciò che aveva: la cavalleria e il terreno.' },
      master: 'Prima chiedete perché hanno scelto proprio quella disposizione. Poi i tre sguardi: il centro debole era una trappola.'
    },
    {
      team: 'C', lens: 'res', who: 'Squadra Cartaginesi: siete Annibale e Maarbale',
      title: 'Il giorno dopo',
      situation: 'Avete vinto. Roma ha perso decine di migliaia di soldati e uno dei due consoli è caduto. Maarbale, comandante dei cavalieri numidi, vi chiede di marciare subito su Roma. Che fate?',
      opts: ['Marciare subito su Roma', 'Consolidare: far riposare l’esercito e cercare alleati nel sud Italia', 'Proporre a Roma una trattativa per riscattare i prigionieri'],
      real: 1,
      gest: ['Marcia sul posto, braccio teso verso l’orizzonte', 'Stiracchiarsi e poi stringere la mano a un compagno', 'Palmi in su e un passo verso l’altra squadra'],
      history: 'Annibale non marciò su Roma. Secondo Livio, Maarbale gli disse: “Tu sai vincere, Annibale, ma non sai usare la vittoria”. Dopo Canne Capua e altre città del sud cambiarono schieramento; Roma rifiutò di trattare e di riscattare i prigionieri.',
      lens3: { str: 'La vittoria militare c’era, ma non un piano per usarla fino in fondo: è il rimprovero di Maarbale.', pol: 'Dopo Canne città come Capua passarono dalla parte di Annibale: la vittoria cambiò le alleanze.', res: 'Un esercito lontano da casa vive di alleati e rifornimenti: cercarli era una scelta di risorse.' },
      master: 'Un successo senza un piano per il dopo che cosa diventa? Lasciate che il parallelo con l’attualità emerga dalla sala.'
    },
    {
      team: 'R', lens: 'res', who: 'Squadra Romani: siete il Senato',
      title: 'Dopo la sconfitta',
      situation: 'A Roma arriva la notizia: un intero esercito è stato annientato. La città è in lutto e in preda al panico. Che cosa decide il Senato?',
      opts: ['Trattare la pace con Annibale', 'Mobilitare tutti gli uomini disponibili, anche chi non possiede terra e perfino gli schiavi', 'Ritirare tutte le forze a Roma e difendere solo la città'],
      real: 1,
      gest: ['Braccia larghe, palmi aperti, un foglio bianco agitato come bandiera', 'Uno chiama con la mano a coppa, gli altri si alzano e si mettono in fila', 'Cerchio stretto, spalle in dentro, sguardo verso l’esterno'],
      history: 'Il Senato rifiutò di trattare e di riscattare i prigionieri e decretò la mobilitazione generale: nuove legioni, arruolando contadini senza terra e perfino schiavi.',
      lens3: { str: 'Roma non cercò la pace: continuò la guerra con più eserciti.', pol: 'Rifiutare di trattare fu una scelta di principio: non mostrare debolezza ad alleati e nemici.', res: 'Per rimpiazzare le perdite si allargò il bacino dei soldati, fino a chi di solito non combatteva.' },
      master: 'Sottolineate la differenza tra cambiare obiettivo e cambiare strada: Roma cambiò il modo, non lo scopo.'
    }
  ];

  var stage = document.getElementById('stage');
  var cards = [];
  var state = SCENES.map(function () { return { choice: null, revealed: false }; });

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function addCard(html, kind, sceneIdx) {
    var el = document.createElement('section');
    el.className = 'card';
    el.innerHTML = '<div class="inner">' + html + '</div>';
    stage.appendChild(el);
    cards.push({ el: el, kind: kind, scene: sceneIdx });
    return el;
  }

  /* 0 · titolo */
  addCard(
    '<span class="tag game">Gioco di ruolo storico</span>' +
    '<h1>Annibale a Canne</h1>' +
    '<p class="lead">2 agosto 216 a.C. Due squadre, Romani e Cartaginesi, prendono a turno quattro decisioni. Poi si scopre che cosa è successo davvero.</p>' +
    '<p class="small">Io faccio il Master. Un portavoce per squadra.</p>' +
    '<div class="big-hint">Premi → per iniziare</div>' +
    '<div class="keys"><kbd>→</kbd> <kbd>Spazio</kbd> avanti &nbsp; <kbd>←</kbd> indietro &nbsp; <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> la scelta della squadra &nbsp; <kbd>N</kbd> note &nbsp; <kbd>F</kbd> schermo intero</div>',
    'title');

  /* 1 · campo e regole */
  (function () {
    var rows = [['Fanti', 80000, 40000, '80.000', '40.000'], ['Cavalieri', 6000, 10000, '6.000', '10.000']];
    var bars = rows.map(function (r) {
      var max = Math.max(r[1], r[2]);
      return '<div class="vsrow"><div class="lab">' + r[0] + '</div>' +
        '<div class="bar"><b style="color:var(--orange)">Romani</b><div class="track"><i style="width:' + (r[1] / max * 100) + '%;background:var(--orange)"></i></div><span>' + r[3] + '</span></div>' +
        '<div class="bar"><b style="color:var(--teal)">Cartaginesi</b><div class="track"><i style="width:' + (r[2] / max * 100) + '%;background:var(--teal)"></i></div><span>' + r[4] + '</span></div></div>';
    }).join('');
    addCard(
      '<span class="tag game">Il campo e le regole</span>' +
      '<h2>Canne, Puglia · 2 agosto 216 a.C.</h2>' +
      '<div class="grid two"><div>' + bars + '<p class="small">Cifre indicative, secondo Polibio. Annibale è in Italia da due anni; i due consoli romani si alternano al comando ogni giorno.</p></div>' +
      '<div class="box"><h3>Come si gioca</h3><div class="steps">' +
        '<div><b>1</b><span>La squadra di turno decide in 40 secondi e mima la scelta per 5 secondi: poi un portavoce preme 1, 2 o 3.</span></div>' +
        '<div><b>2</b><span>Si rivela che cosa è successo davvero.</span></div>' +
        '<div><b>3</b><span>Si leggono i tre sguardi sulla storia: strategia, politica, risorse.</span></div>' +
      '</div><p class="note">Nessun punteggio: conta la discussione.</p></div></div>',
      'scheda');
  })();

  /* 2–5 · scene */
  SCENES.forEach(function (s, i) {
    var l = LENS[s.lens];
    var el = addCard(
      '<span class="tag ' + l.css + '">' + l.name + ' · Decisione ' + (i + 1) + ' di ' + SCENES.length + '</span><span class="teamb ' + s.team + '">Tocca ai ' + TEAMS[s.team] + '</span>' +
      '<h2>' + esc(s.title) + '</h2>' +
      '<div class="grid two">' +
        '<div>' +
          '<div class="who">' + esc(s.who) + '</div>' +
          '<p class="lead" style="max-width:none">' + esc(s.situation) + '</p>' +
          '<div class="opts" role="group" aria-label="Scelte">' +
            s.opts.map(function (o, k) { return '<button class="opt" data-k="' + k + '"><kbd>' + (k + 1) + '</kbd><span>' + esc(o) + '<em class="gest"><b>Mimate</b> ' + esc(s.gest[k]) + '</em></span></button>'; }).join('') +
          '</div>' +
          '<div class="hint" data-hint></div>' +
        '</div>' +
        '<div class="side" data-side></div>' +
      '</div>' +
      '<div class="prompt master">' + esc(s.master) + '</div>',
      'scene', i);
    Array.prototype.forEach.call(el.querySelectorAll('.opt'), function (b) {
      b.addEventListener('click', function () { choose(i, parseInt(b.getAttribute('data-k'), 10)); });
    });
  });

  /* 6 · salto nel tempo */
  addCard(
    '<span class="tag salto">Un salto nel tempo</span>' +
    '<h2>Più di duemila anni dopo: la storia ha insegnato qualcosa?</h2>' +
    '<div class="grid two">' +
      '<div class="box"><span class="role" style="color:var(--orange)">Canne · 216 a.C.</span><h3>Una trappola da manuale</h3><p>In un pomeriggio Annibale accerchia un esercito più grande: il centro cede, la cavalleria chiude le ali. Il suo schema è diventato un modello di strategia.</p></div>' +
      '<div class="box"><span class="role" style="color:var(--teal)">La Marna · settembre 1914</span><h3>Il piano Schlieffen</h3><p>Secondo alcuni storici, ispirato proprio a Canne: aggirare l’esercito francese con una grande ala destra. Dopo circa un mese di marcia le truppe tedesche, stanche e con i rifornimenti allungati, si fermano sulla Marna, vengono contrattaccate e si ritirano. Seguiranno quattro anni di trincee.</p></div>' +
    '</div>' +
    '<div class="lesson">Hanno copiato la tecnica, ma non hanno verificato le variabili.</div>' +
    '<div class="chips"><span class="chip">Il tempo: un pomeriggio, non un mese</span><span class="chip">Le risorse: marce e rifornimenti</span><span class="chip">L’avversario: stavolta reagisce</span></div>' +
    '<div class="prompt"><b>Ora a voi:</b> quando adottiamo una buona pratica che ha funzionato altrove, quali variabili controlliamo prima di replicarla in classe?</div>',
    'salto');

  /* 7 · debrief */
  addCard(
    '<span class="tag game">Debrief</span>' +
    '<h2>Che tecniche abbiamo usato?</h2>' +
    '<div class="grid four">' +
      '<div class="box"><span class="role" style="color:var(--purple)">Role playing</span><h3>Due squadre, quattro ruoli</h3><p>Consoli, comandanti, Senato: ci si mette nei panni di chi decideva, con le informazioni che aveva.</p></div>' +
      '<div class="box"><span class="role" style="color:var(--orange)">Racconto avvincente</span><h3>Una decisione alla volta</h3><p>Una situazione, una scelta, poi il riscontro con quello che è accaduto: la storia diventa una trama.</p></div>' +
      '<div class="box"><span class="role" style="color:var(--green)">Drammatizzazione</span><h3>Mimare la scelta</h3><p>La squadra recita la decisione con il corpo: la storia si vive, non si legge soltanto.</p></div>' +
      '<div class="box"><span class="role" style="color:var(--teal)">Salto temporale</span><h3>Da Canne alla Marna</h3><p>Un confronto a distanza di secoli: la stessa tecnica, un contesto diverso. Cosa cambia quando le variabili cambiano?</p></div>' +
    '</div>' +
    '<div class="chips"><span class="chip">Strategia</span><span class="chip">Politica</span><span class="chip">Risorse</span></div>' +
    '<div class="prompt"><b>Ora tocca a voi:</b> quale evento o problema della vostra materia potrebbe diventare una decisione di squadra?</div>',
    'debrief');

  /* ---------- logica delle scene ---------- */
  function sceneCard(i) { for (var k = 0; k < cards.length; k++) if (cards[k].kind === 'scene' && cards[k].scene === i) return k; return -1; }

  function choose(i, k) {
    if (state[i].revealed) return;
    state[i].choice = k;
    renderScene(i);
  }

  function renderScene(i) {
    var s = SCENES[i], st = state[i];
    var el = cards[sceneCard(i)].el;
    Array.prototype.forEach.call(el.querySelectorAll('.opt'), function (b) {
      var k = parseInt(b.getAttribute('data-k'), 10);
      b.classList.toggle('picked', st.choice === k);
      b.classList.toggle('real', st.revealed && s.real === k);
      var old = b.querySelector('.real-badge'); if (old) old.remove();
      if (st.revealed && s.real === k) {
        var sp = document.createElement('span'); sp.className = 'real-badge'; sp.textContent = 'Nella storia'; b.appendChild(sp);
      }
    });
    var side = el.querySelector('[data-side]');
    var html = '';
    if (!st.revealed) {
      html = '<div class="wait">' + (st.choice === null
        ? 'La squadra dei ' + TEAMS[s.team] + ' discute e decide.<br>Poi si preme 1, 2 o 3.'
        : 'I ' + TEAMS[s.team] + ' hanno scelto l’opzione ' + (st.choice + 1) + '.<br>Che cosa è successo davvero?') + '</div>';
    } else {
      var match = st.choice === s.real;
      html += '<div class="panel reveal" style="border-color:var(--green)"><h4>Che cosa è successo davvero</h4><p>' + esc(s.history) + '</p>' +
        (st.choice !== null ? '<p class="note">' + (match ? 'La squadra dei ' + TEAMS[s.team] + ' ha scelto come nella storia.' : 'La squadra dei ' + TEAMS[s.team] + ' ha scelto in modo diverso dalla storia.') + '</p>' : '') + '</div>';
      html += '<div class="panel reveal"><h4>Tre sguardi</h4><div class="lens">' +
        ['str', 'pol', 'res'].map(function (k) { return '<div class="' + k.charAt(0) + '"><b>' + LENS[k].name + '</b><span>' + esc(s.lens3[k]) + '</span></div>'; }).join('') +
        '</div></div>';
    }
    side.innerHTML = html;
    el.querySelector('[data-hint]').textContent = st.revealed
      ? (i === SCENES.length - 1 ? 'Premi → per continuare.' : 'Premi → per la prossima decisione.')
      : 'Premi → per scoprire che cosa è successo.';
    fit();
  }

  /* ---------- navigazione ---------- */
  var idx = 0;
  var xp = document.getElementById('xp'), count = document.getElementById('count'), dots = document.getElementById('dots');
  var prev = document.getElementById('prev'), next = document.getElementById('next');

  dots.innerHTML = cards.map(function (c, i) { return '<button aria-label="Vai alla carta ' + (i + 1) + '" data-i="' + i + '"></button>'; }).join('');
  dots.addEventListener('click', function (e) { var t = e.target.closest('button'); if (t) go(parseInt(t.getAttribute('data-i'), 10)); });

  function fit() {
    var c = cards[idx]; if (!c) return;
    var inner = c.el.firstChild;
    inner.style.zoom = 1;
    var z = 1;
    while (c.el.scrollHeight > c.el.clientHeight + 1 && z > 0.5) { z -= 0.03; inner.style.zoom = z; }
  }
  window.addEventListener('resize', fit);

  function go(n) {
    idx = Math.max(0, Math.min(cards.length - 1, n));
    cards.forEach(function (c, i) { c.el.classList.toggle('active', i === idx); });
    var ds = dots.children;
    for (var i = 0; i < ds.length; i++) ds[i].className = i === idx ? 'on' : (i < idx ? 'done' : '');
    xp.style.width = (idx / (cards.length - 1)) * 100 + '%';
    count.textContent = (idx + 1) + ' / ' + cards.length;
    prev.disabled = idx === 0; next.disabled = idx === cards.length - 1;
    cards[idx].el.scrollTop = 0;
    fit();
    try { history.replaceState(null, '', '#' + (idx + 1)); } catch (e) {}
  }

  function advance() {
    var c = cards[idx];
    if (c.kind === 'scene' && !state[c.scene].revealed) { state[c.scene].revealed = true; renderScene(c.scene); return; }
    go(idx + 1);
  }
  prev.addEventListener('click', function () { go(idx - 1); });
  next.addEventListener('click', advance);

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') {
      var ae = document.activeElement;
      if (ae && ae.classList.contains('opt') && (k === 'Enter' || k === ' ')) return;
      e.preventDefault(); advance();
    }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(idx - 1); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(cards.length - 1);
    else if (k === 'f' || k === 'F') toggleFs();
    else if (k === 'n' || k === 'N') document.body.classList.toggle('master');
    else if ((k === '1' || k === '2' || k === '3') && cards[idx].kind === 'scene') choose(cards[idx].scene, parseInt(k, 10) - 1);
  });

  var sx = null;
  document.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx;
    if (Math.abs(dx) > 70) { if (dx < 0) advance(); else go(idx - 1); }
    sx = null;
  }, { passive: true });

  function toggleFs() {
    if (!document.fullscreenElement) { (document.documentElement.requestFullscreen || function () {}).call(document.documentElement); }
    else { document.exitFullscreen(); }
  }
  document.getElementById('fs').addEventListener('click', toggleFs);
  document.getElementById('mbtn').addEventListener('click', function () { document.body.classList.toggle('master'); });

  SCENES.forEach(function (s, i) { renderScene(i); });
  var start = parseInt((location.hash || '').replace('#', ''), 10);
  go(isNaN(start) ? 0 : start - 1);
})();
</script>
</body>
</html>
